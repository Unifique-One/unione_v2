# UNIFIQUE ONE — dynamic Traefik configuration
# Fonte: pacote unifique-one-cloudflare-podman-quadlet.zip + integração da suíte Nextcloud.
# Domínio único autorizado: csphere.cloud.
# Upstreams usam os aliases da rede Podman "unione".

http:
  middlewares:
    security-headers:
      headers:
        contentTypeNosniff: true
        referrerPolicy: "strict-origin-when-cross-origin"
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: false

    compress:
      compress: {}

    forwarded-https:
      headers:
        customRequestHeaders:
          X-Forwarded-Proto: https

    # Prefixos das aplicações Nextcloud
    prefix-files:
      addPrefix:
        prefix: /apps/files
    prefix-spreed:
      addPrefix:
        prefix: /apps/spreed
    prefix-calendar:
      addPrefix:
        prefix: /apps/calendar
    prefix-contacts:
      addPrefix:
        prefix: /apps/contacts
    prefix-forms:
      addPrefix:
        prefix: /apps/forms
    prefix-deck:
      addPrefix:
        prefix: /apps/deck
    prefix-whiteboard:
      addPrefix:
        prefix: /apps/whiteboard
    whiteboard-root:
      replacePathRegex:
        regex: '^/$'
        replacement: /apps/whiteboard/picker
    prefix-notes:
      addPrefix:
        prefix: /apps/notes
    prefix-tasks:
      addPrefix:
        prefix: /apps/tasks
    prefix-assistant:
      addPrefix:
        prefix: /apps/assistant
    prefix-index:
      addPrefix:
        prefix: /index.php
    prefix-mail:
      addPrefix:
        prefix: /apps/mail

    # Reescrituras da API
    prefix-remote:
      addPrefix:
        prefix: /remote.php
    prefix-remote-dav:
      addPrefix:
        prefix: /remote.php/dav
    ocs-v1-to-v2:
      replacePathRegex:
        regex: '^/ocs/v1\.php/(.*)'
        replacement: /ocs/v2.php/$1
    ocs-plain-to-v2:
      replacePathRegex:
        regex: '^/ocs/(.*)'
        replacement: /ocs/v2.php/$1

    # admin.csphere.cloud
    admin-auth:
      basicAuth:
        usersFile: /etc/traefik/admin.htpasswd
        realm: UNIFIQUE ONE Admin

  services:
    nextcloud:
      loadBalancer:
        servers:
          - url: "http://nextcloud:80"
        passHostHeader: true

    collabora:
      loadBalancer:
        servers:
          - url: "http://collabora:9980"
        passHostHeader: true

    status:
      loadBalancer:
        servers:
          - url: "http://status:80"
        passHostHeader: true

  routers:
    cloud:
      rule: 'Host(`cloud.csphere.cloud`)'
      entryPoints: [web]
      service: nextcloud
      middlewares: [security-headers, compress, forwarded-https]

    drive:
      rule: 'Host(`drive.csphere.cloud`)'
      entryPoints: [web]
      service: nextcloud
      middlewares: [security-headers, compress, forwarded-https, prefix-files]

    files:
      rule: 'Host(`files.csphere.cloud`)'
      entryPoints: [web]
      service: nextcloud
      middlewares: [security-headers, compress, forwarded-https, prefix-files]

    office:
      rule: 'Host(`office.csphere.cloud`)'
      entryPoints: [web]
      service: collabora
      middlewares: [security-headers, compress, forwarded-https]

    meet:
      rule: 'Host(`meet.csphere.cloud`)'
      entryPoints: [web]
      service: nextcloud
      middlewares: [security-headers, compress, forwarded-https, prefix-spreed]

    calendar:
      rule: 'Host(`calendar.csphere.cloud`)'
      entryPoints: [web]
      service: nextcloud
      middlewares: [security-headers, compress, forwarded-https, prefix-calendar]

    contacts:
      rule: 'Host(`contacts.csphere.cloud`)'
      entryPoints: [web]
      service: nextcloud
      middlewares: [security-headers, compress, forwarded-https, prefix-contacts]

    forms:
      rule: 'Host(`forms.csphere.cloud`)'
      entryPoints: [web]
      service: nextcloud
      middlewares: [security-headers, compress, forwarded-https, prefix-forms]

    board:
      rule: 'Host(`board.csphere.cloud`)'
      entryPoints: [web]
      service: nextcloud
      middlewares: [security-headers, compress, forwarded-https, prefix-deck]

    whiteboard:
      rule: 'Host(`whiteboard.csphere.cloud`)'
      entryPoints: [web]
      service: nextcloud
      middlewares: [security-headers, compress, forwarded-https, whiteboard-root]

    notes:
      rule: 'Host(`notes.csphere.cloud`)'
      entryPoints: [web]
      service: nextcloud
      middlewares: [security-headers, compress, forwarded-https, prefix-notes]

    tasks:
      rule: 'Host(`tasks.csphere.cloud`)'
      entryPoints: [web]
      service: nextcloud
      middlewares: [security-headers, compress, forwarded-https, prefix-tasks]

    projects:
      rule: 'Host(`projects.csphere.cloud`)'
      entryPoints: [web]
      service: nextcloud
      middlewares: [security-headers, compress, forwarded-https, prefix-deck]

    ai:
      # AI runtime deferido por decisão do usuário: apenas interface Assistant.
      rule: 'Host(`ai.csphere.cloud`)'
      entryPoints: [web]
      service: nextcloud
      middlewares: [security-headers, compress, forwarded-https, prefix-assistant]

    id:
      rule: 'Host(`id.csphere.cloud`)'
      entryPoints: [web]
      service: nextcloud
      middlewares: [security-headers, compress, forwarded-https]

    auth:
      rule: 'Host(`auth.csphere.cloud`)'
      entryPoints: [web]
      service: nextcloud
      middlewares: [security-headers, compress, forwarded-https, prefix-index]

    mail:
      rule: 'Host(`mail.csphere.cloud`)'
      entryPoints: [web]
      service: nextcloud
      middlewares: [security-headers, compress, forwarded-https, prefix-mail]

    status:
      rule: 'Host(`status.csphere.cloud`)'
      entryPoints: [web]
      service: status
      middlewares: [security-headers, compress]

    admin:
      rule: 'Host(`admin.csphere.cloud`)'
      entryPoints: [web]
      service: nextcloud
      middlewares: [security-headers, admin-auth, forwarded-https]

    # api.csphere.cloud — rotas específicas com prioridade maior que o fallback.
    api-ocs-v2:
      rule: 'Host(`api.csphere.cloud`) && PathPrefix(`/ocs/v2.php`)'
      priority: 100
      entryPoints: [web]
      service: nextcloud
      middlewares: [security-headers, forwarded-https]
    api-ocs-v1:
      rule: 'Host(`api.csphere.cloud`) && PathPrefix(`/ocs/v1.php`)'
      priority: 99
      entryPoints: [web]
      service: nextcloud
      middlewares: [security-headers, forwarded-https, ocs-v1-to-v2]
    api-ocs:
      rule: 'Host(`api.csphere.cloud`) && PathPrefix(`/ocs/`)'
      priority: 98
      entryPoints: [web]
      service: nextcloud
      middlewares: [security-headers, forwarded-https, ocs-plain-to-v2]
    api-remote:
      rule: 'Host(`api.csphere.cloud`) && PathPrefix(`/remote.php`)'
      priority: 97
      entryPoints: [web]
      service: nextcloud
      middlewares: [security-headers, forwarded-https]
    api-dav:
      rule: 'Host(`api.csphere.cloud`) && PathPrefix(`/dav`)'
      priority: 96
      entryPoints: [web]
      service: nextcloud
      middlewares: [security-headers, forwarded-https, prefix-remote]
    api-webdav:
      rule: 'Host(`api.csphere.cloud`) && PathPrefix(`/webdav`)'
      priority: 95
      entryPoints: [web]
      service: nextcloud
      middlewares: [security-headers, forwarded-https, prefix-remote]
    api-caldav:
      rule: 'Host(`api.csphere.cloud`) && PathPrefix(`/caldav`)'
      priority: 94
      entryPoints: [web]
      service: nextcloud
      middlewares: [security-headers, forwarded-https, prefix-remote-dav]
    api-carddav:
      rule: 'Host(`api.csphere.cloud`) && PathPrefix(`/carddav`)'
      priority: 93
      entryPoints: [web]
      service: nextcloud
      middlewares: [security-headers, forwarded-https, prefix-remote-dav]
    api-default:
      rule: 'Host(`api.csphere.cloud`)'
      priority: 1
      entryPoints: [web]
      service: nextcloud
      middlewares: [security-headers, forwarded-https, prefix-remote]
